name: NoxScreen Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify NoxScreen (APKPure & Play Store Ready)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Environment Files
        run: touch .env .env.example

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Setup Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore (for APKPure & Release APK)
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 -d > release-keystore.jks
          elif [ ! -f release-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -storepass noxscreen2025 \
              -alias noxscreen \
              -keypass noxscreen2025 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NoxScreen Pro, OU=Mobile, O=NoxScreen, L=Mogadishu, S=Banaadir, C=SO"
          fi

      - name: Build Signed Release APK & AAB (APKPure Ready)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'noxscreen2025' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'noxscreen' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'noxscreen2025' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Prepare Release APK File
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NoxScreen-Pro-Release.apk

      - name: Upload APKPure Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxScreen-Pro-APKPure-Release-APK
          path: app/build/outputs/apk/release/NoxScreen-Pro-Release.apk

      - name: Upload Release Keystore (Backup for Future Updates)
        uses: actions/upload-artifact@v4
        with:
          name: NoxScreen-Release-Keystore-Backup
          path: release-keystore.jks

      - name: Upload Play Store Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NoxScreen-Pro-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
