name: NoXScreen Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Run Lint & Unit Tests
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Setup Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Debug APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NoXScreen-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoXScreen-debug
          path: app/build/outputs/apk/debug/NoXScreen-debug.apk

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.ENCODED_STRING != '' }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > keystore.jks

      - name: Build Release APK & AAB
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: ${{ env.SIGNING_KEY_ALIAS != '' }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"

      - name: Rename Release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -type f | head -n 1)

          if [ -n "$APK" ]; then
            mv "$APK" app/build/outputs/apk/release/NoXScreen.apk
          fi

      - name: Rename Release AAB
        if: ${{ hashFiles('app/build/outputs/bundle/release/*.aab') != '' }}
        run: |
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" -type f | head -n 1)

          if [ -n "$AAB" ]; then
            mv "$AAB" app/build/outputs/bundle/release/NoXScreen.aab
          fi

      - name: Upload NoXScreen Release APK
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/release/NoXScreen.apk') != '' }}
        with:
          name: NoXScreen
          path: app/build/outputs/apk/release/NoXScreen.apk

      - name: Upload NoXScreen Release AAB
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/NoXScreen.aab') != '' }}
        with:
          name: NoXScreen-AAB
          path: app/build/outputs/bundle/release/NoXScreen.aab
