name: NoxScreen Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify NoxScreen
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Setup Environment Files
        run: touch .env .env.example
          
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Code Quality & Linting
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Setup Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        
      - name: Rename & Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noxscreen-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Release Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.ENCODED_STRING != '' }}
        run: |
          echo $ENCODED_STRING | base64 -d > keystore.jks
          
      - name: Build Release APK & AAB
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: ${{ env.SIGNING_KEY_ALIAS != '' }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

      - name: Prepare Release Artifacts (Rename APK)
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        run: |
          find app/build/outputs/apk/release -name "*.apk" -type f -exec mv {} app/build/outputs/apk/release/noxscreen.apk \;

      - name: Upload Release APK (noxscreen.zip / noxscreen.apk)
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/release/noxscreen.apk') != '' }}
        with:
          name: noxscreen
          path: app/build/outputs/apk/release/noxscreen.apk

      - name: Upload Release AAB (noxscreen-bundle.zip)
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: noxscreen-bundle
          path: app/build/outputs/bundle/release/*.aab
